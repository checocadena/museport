[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "museport"
version = "0.1.0"
description = "Meta's Muse models plan and port real CUDA projects to open SYCL, with every step proven."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Checo Cadena", email = "checo@innercircuit.com" }]
# The pre-existing toolkit, pinned (open source, AGPL-3.0). Its state before the hackathon is
# the tag pre_hackathon; later changes made for Muse Port are listed in docs/CHANGES-TO-TOOLKIT.md
# (pinned at the merge of #20, native_flags).
dependencies = [
  "oneapi-agent-toolkit @ git+https://github.com/checocadena/oneapi-agent-toolkit@e6936014e53018792f3c848bedff79d579b1984d",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
museport = "museport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["oneapi_agent.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
